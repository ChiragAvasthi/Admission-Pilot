version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - ./company_workspaces:/app/company_workspaces
    env_file:
      - .env.production
    environment:
      # Override paths for docker
      - DATABASE_URL=sqlite+aiosqlite:////app/data/admission_pilot.db
      - CHROMADB_DIR=/app/data/chroma_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:
